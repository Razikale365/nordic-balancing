[project]
name = "nordic-balancing"
version = "1.0.0rc2"
description = "Python client for Nordic electricity balancing and imbalance data (Energinet, Fingrid, Svenska kraftnät, eSett, ENTSO-E), normalised to 15-minute UTC intervals."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Razikale365", email = "66191390+Razikale365@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
]
keywords = [
    "energy",
    "electricity",
    "balancing",
    "imbalance",
    "mfrr",
    "afrr",
    "nordic",
    "energinet",
    "fingrid",
    "esett",
    "svenska-kraftnat",
    "entsoe",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Razikale365/nordic-balancing"
Issues = "https://github.com/Razikale365/nordic-balancing/issues"

[project.optional-dependencies]
pandas = [
    "pandas>=2.1",
]

[dependency-groups]
benchmarks = [
    "pandas>=2.1",
    "psutil>=6.0",
]
benchmarks-compare = [
    "entsoe-py==0.8.1",
    "esett-py==0.1.0",
    "fingrid-py==0.2.0",
    "clarigrid==0.2.0",
    "psutil==7.2.2",
]
dev = [
    "pytest>=8.3",
    "mypy>=1.11",
    "ruff>=0.6",
    "hypothesis>=6.168.5",
    "pandas-stubs>=3.0.5.260914",
    "pandas>=2.1",
    "coverage>=7.6",
]
# Installed only by the release workflow, to check the built distributions.
release = [
    "twine==6.1.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["nordic_balancing"]

[tool.coverage.report]
fail_under = 98
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = ["live: calls real data source APIs (run with: pytest -m live)"]
