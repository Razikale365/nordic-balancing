[project]
name = "nordic-balancing"
version = "0.1.0.dev0"
description = "Python client for Nordic electricity balancing and imbalance data (Energinet, Fingrid, Svenska kraftnät, eSett, ENTSO-E), normalised to 15-minute UTC intervals."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Razikale365", email = "66191390+Razikale365@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]
keywords = [
    "energy",
    "electricity",
    "balancing",
    "imbalance",
    "mfrr",
    "afrr",
    "nordic",
    "energinet",
    "fingrid",
    "esett",
    "svenska-kraftnat",
    "entsoe",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Razikale365/nordic-balancing"
Issues = "https://github.com/Razikale365/nordic-balancing/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = ["live: calls real data source APIs (run with: pytest -m live)"]
