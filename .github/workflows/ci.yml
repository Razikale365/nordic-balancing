name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run coverage run -m pytest
      - name: Check branch coverage
        run: uv run coverage report
      - run: uv build
      - name: Smoke-test the built wheel and sdist in clean environments
        run: |
          for dist in dist/*.whl dist/*.tar.gz; do
            rm -rf /tmp/smoke
            uv venv /tmp/smoke --python ${{ matrix.python-version }}
            uv pip install --python /tmp/smoke --prerelease=allow "$dist"
            /tmp/smoke/bin/python -c "import nordic_balancing as n; print(n.__version__, len(n.__all__))"
          done

  lowest-direct:
    name: lowest-direct (httpx 0.27.0, pandas 2.1.1, numpy<2; transitive dependencies latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Install the declared dependency floor into a fresh environment (no lockfile)
        run: |
          uv venv /tmp/floor --python 3.12
          # pandas 2.1.1 is the first 2.1.x release with Python 3.12 wheels;
          # 2.1.0 needs a source build.
          uv pip install --python /tmp/floor . "httpx==0.27.0" "pandas==2.1.1" "numpy<2" pytest hypothesis
      - name: Run the offline tests against the installed package
        run: /tmp/floor/bin/python -m pytest -q
