name: Live

# Daily run of the tests marked `live` against the real APIs. Not run on pull requests,
# because they need the repository secrets.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # The live tests skip when a key is missing, which would give a green run that
      # tested nothing for Fingrid and ENTSO-E.
      - name: Require both API keys
        env:
          FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          test -n "$FINGRID_API_KEY" || { echo "::error::FINGRID_API_KEY secret is empty"; exit 1; }
          test -n "$ENTSOE_API_KEY" || { echo "::error::ENTSOE_API_KEY secret is empty"; exit 1; }
      - name: Run the live tests (failures retried once after 60 s; any skip fails the job)
        env:
          FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          set +e
          : > rerun.log
          uv run pytest -q -m live -rs 2>&1 | tee first.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            sleep 60
            uv run pytest -q -m live -rs --lf --lfnf=none 2>&1 | tee rerun.log
            status=${PIPESTATUS[0]}
          fi
          if grep -h -E '^SKIPPED|[0-9]+ skipped' first.log rerun.log 2>/dev/null; then
            echo "::error::live tests were skipped"
            exit 1
          fi
          exit "$status"
